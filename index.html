<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ลิสต์คู่แข่ง E-Com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<style>
:root{
  --bg:#f6f4ef;
  --surface:#ffffff;
  --surface-2:#faf9f5;
  --ink:#211f1a;
  --muted:#6f6a60;
  --faint:#9a9488;
  --line:#e5e1d6;
  --line-2:#efece3;
  --accent-wpc:#1d4ed8;
  --accent-wpc-bg:#eaf0fe;
  --accent-atelier:#7a4a2f;
  --accent-atelier-bg:#f4ece3;
  --accent-luck:#0f766e;
  --accent-luck-bg:#e6f3f1;
  --shopee:#ee4d2d;
  --lazada:#6c2eb9;
  --tiktok:#0e0e10;
  --ig1:#8134af; --ig2:#dd2a7b; --ig3:#f58529;
  --facebook:#1877f2;
  --good:#1a7f4b;
  --good-bg:#e6f5ec;
  --shadow: 0 1px 2px rgba(33,31,26,.04), 0 8px 24px -12px rgba(33,31,26,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17160f;
    --surface:#211f19;
    --surface-2:#28261e;
    --ink:#f1eee4;
    --muted:#b3ab99;
    --faint:#847c6c;
    --line:#39362b;
    --line-2:#2c2a22;
    --accent-wpc:#7fa2ff;
    --accent-wpc-bg:#1c2748;
    --accent-atelier:#e0ac83;
    --accent-atelier-bg:#3a2a1e;
    --accent-luck:#5fd3c4;
    --accent-luck-bg:#153531;
    --good:#6ed69a;
    --good-bg:#153524;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#17160f;
  --surface:#211f19;
  --surface-2:#28261e;
  --ink:#f1eee4;
  --muted:#b3ab99;
  --faint:#847c6c;
  --line:#39362b;
  --line-2:#2c2a22;
  --accent-wpc:#7fa2ff;
  --accent-wpc-bg:#1c2748;
  --accent-atelier:#e0ac83;
  --accent-atelier-bg:#3a2a1e;
  --accent-luck:#5fd3c4;
  --accent-luck-bg:#153531;
  --good:#6ed69a;
  --good-bg:#153524;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans Thai','IBM Plex Sans','Segoe UI',Tahoma,sans-serif;
  font-size:15px;
  line-height:1.55;
  padding-inline:16px;
}
.tabular{font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding-block:18px 48px}

/* ---- top bar ---- */
.top{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px}
.top h1{font-family:'IBM Plex Sans',sans-serif;font-size:20px;font-weight:700;margin:0 0 3px;letter-spacing:-.2px;text-wrap:balance}
.top .sub{font-size:12.5px;color:var(--muted);margin:0}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.masterctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none;background:var(--surface-2);border:1px solid var(--line);padding:7px 12px 7px 8px;border-radius:999px}
.switch input{appearance:none;width:30px;height:17px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked{background:var(--ink)}
.switch input:checked::after{left:15px}
.switch.on{color:var(--ink)}

.counters{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.ctr{flex:1;min-width:150px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 13px}
.ctr .cl{font-size:10.5px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.ctr .cv{font-size:19px;font-weight:700;margin-top:2px;font-family:'IBM Plex Sans',sans-serif}
.ctr .cv b{font-weight:400;font-size:13px;color:var(--muted)}
.ctr.wpc{border-left:3px solid var(--accent-wpc)}
.ctr.atelier{border-left:3px solid var(--accent-atelier)}
.ctr.luck{border-left:3px solid var(--accent-luck)}

/* ---- biz tabs ---- */
.biztabs{display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding-block:10px 6px;z-index:20;flex-wrap:wrap}
.biztab{flex:1;min-width:150px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;border-radius:12px;padding:10px 14px;font-family:inherit;font-size:14px;font-weight:700;color:var(--muted);text-align:left;transition:border-color .12s,color .12s}
.biztab .bt-l{display:block;font-size:10px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.biztab.active{color:var(--ink)}
.biztab[data-biz="wpc"].active{border-color:var(--accent-wpc)}
.biztab[data-biz="atelier"].active{border-color:var(--accent-atelier)}
.biztab[data-biz="luck"].active{border-color:var(--accent-luck)}
.biztab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.bizpage{display:none}
.bizpage.active{display:block}

/* ---- platform subtabs ---- */
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.ptab{border:1px solid var(--line);background:var(--surface);cursor:pointer;padding:7px 14px;border-radius:9px;font-size:13px;font-weight:600;font-family:inherit;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.ptab .dot{width:8px;height:8px;border-radius:50%;flex:none}
.ptab.active{color:var(--ink);border-color:var(--ink)}
.ptab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.psec{display:none}
.psec.active{display:block}

/* ---- groups ---- */
.grp{margin-top:18px}
.grph{display:flex;align-items:baseline;gap:9px;margin-bottom:3px;flex-wrap:wrap}
.grph .gt{font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:15px}
.grph .gc{font-size:12px;color:var(--muted)}
.grpnote{font-size:12px;color:var(--faint);margin:0 0 10px;max-width:70ch}

/* ---- card list (single column, stacked) ---- */
.grid{display:flex;flex-direction:column;gap:8px}

.card{background:var(--surface);border:2px solid var(--line);border-radius:13px;padding:14px 15px 13px;position:relative;box-shadow:var(--shadow);transition:opacity .15s,border-color .15s,background .15s,box-shadow .15s}
.card.dim{opacity:.42;filter:saturate(.75)}
.card.dim:hover{opacity:.68}
.card.on{border-color:var(--good);background:var(--good-bg);box-shadow:0 2px 4px rgba(26,127,75,.1),0 10px 26px -14px rgba(26,127,75,.35)}

.chk{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:7px;border:2.5px solid var(--muted);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.chk svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .1s}
.chk:hover{border-color:var(--ink)}
.chk.on{background:var(--good);border-color:var(--good)}
.chk.on svg{opacity:1}
.chk:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card.on .chk{box-shadow:0 1px 3px rgba(26,127,75,.4)}

.cname{font-weight:700;font-size:14.5px;padding-right:32px;line-height:1.35;overflow-wrap:anywhere}
.card.on .cname{color:var(--good)}
.cname a{color:inherit;text-decoration:none;border-bottom:1.5px solid var(--line);transition:border-color .12s}
.cname a:hover{border-bottom-color:currentColor}
.cname a::after{content:"\2197";font-size:11px;margin-left:3px;color:var(--faint)}
.badgerow{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.bdg{font-size:10px;font-weight:700;padding:2.5px 8px;border-radius:6px;letter-spacing:.01em;line-height:1.5;white-space:nowrap}
.bdg.mall-shopee{background:var(--shopee);color:#fff}
.bdg.mall-laz{background:var(--lazada);color:#fff}
.bdg.pref2{background:#fff1e0;color:#9a5310}
.bdg.pref1{background:#fff7ea;color:#b5761c}
.bdg.gen{background:var(--surface-2);color:var(--faint);border:1px solid var(--line)}
.plattag{font-size:10px;font-weight:700;padding:2.5px 8px;border-radius:6px;color:#fff}
.plattag.shopee{background:var(--shopee)}
.plattag.lazada{background:var(--lazada)}
.plattag.tiktok{background:var(--tiktok)}
.plattag.facebook{background:var(--facebook)}
.plattag.ig{background:linear-gradient(135deg,var(--ig3),var(--ig2),var(--ig1))}

.stats{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.stats li{font-size:12px;color:var(--muted)}
.stats li b{color:var(--ink);font-weight:600}

.reason{font-size:12px;color:var(--ink);background:var(--surface-2);border-left:3px solid var(--line);border-radius:0 8px 8px 0;padding:7px 10px;margin-top:9px;line-height:1.55}
.reason b{font-weight:700}
.card.on .reason{border-left-color:var(--good)}

.card.ref{border-style:dashed}
.reflabel{position:absolute;top:11px;left:14px;font-size:9.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.card.ref .cname{margin-top:14px}

footer{margin-top:28px;font-size:11.5px;color:var(--faint);text-align:center}

@media (max-width:480px){
  .toprow{flex-direction:column}
}
</style>

var STORAGE_KEY = "competitor-picks-v1";
var picks = {};
try{
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw) picks = JSON.parse(raw) || {};
}catch(e){picks = {};}

function savePicks(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(picks)); }catch(e){}
}

function platClass(biz, p){
  if(p==="ig") return "ig";
  return p;
}
function platLabel(p){
  return {shopee:"Shopee", lazada:"Lazada", tiktok:"TikTok", ig:"Instagram", facebook:"Facebook"}[p] || p;
}

function renderCard(item, platformKey){
  var checked = !!picks[item.id];
  var cls = "card" + (checked ? " on" : "") + (item.ref ? " ref" : "");
  var html = '<div class="'+cls+'" data-id="'+item.id+'">';
  if(item.ref) html += '<span class="reflabel">อ้างอิงที่ผู้ใช้ระบุ</span>';
  html += '<div class="chk'+(checked?' on':'')+'" role="checkbox" aria-checked="'+checked+'" tabindex="0" data-id="'+item.id+'">';
  html += '<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"></polyline></svg></div>';
  var nameHtml = item.link
    ? '<a href="'+item.link+'" target="_blank" rel="noopener noreferrer">'+item.name+'</a>'
    : item.name;
  html += '<div class="cname">'+nameHtml+'</div>';
  html += '<div class="badgerow">'+plat(platClass(null,platformKey), platLabel(platformKey))+(item.badge?item.badge:'')+'</div>';
  html += '<ul class="stats">';
  (item.stats||[]).forEach(function(s){ html += '<li>'+s+'</li>'; });
  html += '</ul>';
  var lead = "เลือกเพราะ";
  var reasonHtml = item.reason.indexOf(lead) === 0
    ? '<b>'+lead+'</b>'+item.reason.slice(lead.length)
    : item.reason;
  html += '<div class="reason">'+reasonHtml+'</div>';
  html += '</div>';
  return html;
}

function renderPlatform(container, groups, platformKey){
  var html = "";
  groups.forEach(function(g){
    if(g.grp){
      html += '<div class="grp"><div class="grph"><span class="gt">'+g.grp+'</span></div>';
      if(g.note) html += '<p class="grpnote">'+g.note+'</p>';
    } else {
      html += '<div class="grp">';
    }
    html += '<div class="grid">';
    g.items.forEach(function(it){ html += renderCard(it, platformKey); });
    html += '</div></div>';
  });
  container.innerHTML = html;
}

function renderAll(){
  renderPlatform(document.getElementById("wpc-shopee"), DATA.wpc.shopee, "shopee");
  renderPlatform(document.getElementById("wpc-lazada"), DATA.wpc.lazada, "lazada");
  renderPlatform(document.getElementById("wpc-tiktok"), DATA.wpc.tiktok, "tiktok");
  renderPlatform(document.getElementById("wpc-facebook"), DATA.wpc.facebook, "facebook");
  renderPlatform(document.getElementById("atelier-ig"), DATA.atelier.ig, "ig");
  renderPlatform(document.getElementById("luck-shopee"), DATA.luck.shopee, "shopee");
  renderPlatform(document.getElementById("luck-lazada"), DATA.luck.lazada, "lazada");
  renderPlatform(document.getElementById("luck-tiktok"), DATA.luck.tiktok, "tiktok");
  updateCounts();
  updateDimAll();
  applyShowSelected();
}

function allIdsFor(biz){
  var ids = [];
  Object.keys(DATA[biz]).forEach(function(p){
    DATA[biz][p].forEach(function(g){
      g.items.forEach(function(it){ ids.push(it.id); });
    });
  });
  return ids;
}

function updateCounts(){
  ["wpc","atelier","luck"].forEach(function(biz){
    var ids = allIdsFor(biz);
    var n = ids.filter(function(id){ return picks[id]; }).length;
    var el = document.getElementById("cnt-"+biz);
    el.innerHTML = n + ' <b>/ '+ids.length+' ร้าน</b>';
  });
}

function applyShowSelected(){
  var onlySel = document.getElementById("showSelOnly").checked;
  document.querySelectorAll(".card").forEach(function(c){
    var id = c.getAttribute("data-id");
    c.style.display = (onlySel && !picks[id]) ? "none" : "";
  });
  document.querySelectorAll(".grid").forEach(function(grid){
    if(grid.children.length === 0) return; // empty-by-design group (e.g. explanatory note) — always keep visible
    var anyVisible = Array.prototype.some.call(grid.children, function(c){ return c.style.display !== "none"; });
    grid.parentElement.style.display = anyVisible ? "" : "none";
  });
}

// Cards start fully legible. Once at least one card in a list (.psec) is
// ticked, every OTHER (untouched) card in that same list dims — the ticked
// one(s) stay full-strength. With nothing ticked yet in a list, nothing dims.
function updateDimAll(){
  document.querySelectorAll(".psec").forEach(function(sec){
    var cards = sec.querySelectorAll(".card");
    var anyOn = Array.prototype.some.call(cards, function(c){ return c.classList.contains("on"); });
    cards.forEach(function(c){
      c.classList.toggle("dim", anyOn && !c.classList.contains("on"));
    });
  });
}

document.addEventListener("click", function(e){
  var chk = e.target.closest(".chk");
  if(chk){
    var id = chk.getAttribute("data-id");
    picks[id] = !picks[id];
    savePicks();
    var card = chk.closest(".card");
    chk.classList.toggle("on", !!picks[id]);
    chk.setAttribute("aria-checked", !!picks[id]);
    card.classList.toggle("on", !!picks[id]);
    updateCounts();
    updateDimAll();
    applyShowSelected();
    return;
  }
  var biztab = e.target.closest(".biztab");
  if(biztab){
    document.querySelectorAll(".biztab").forEach(function(b){ b.classList.remove("active"); });
    biztab.classList.add("active");
    var biz = biztab.getAttribute("data-biz");
    document.querySelectorAll(".bizpage").forEach(function(pg){
      pg.classList.toggle("active", pg.getAttribute("data-bizpage")===biz);
    });
    return;
  }
  var ptab = e.target.closest(".ptab");
  if(ptab){
    var wrap = ptab.closest(".ptabs");
    var biz = wrap.getAttribute("data-ptabs");
    wrap.querySelectorAll(".ptab").forEach(function(b){ b.classList.remove("active"); });
    ptab.classList.add("active");
    var p = ptab.getAttribute("data-p");
    document.querySelectorAll('[id^="'+biz+'-"]').forEach(function(sec){
      sec.classList.toggle("active", sec.id === biz+"-"+p);
    });
    return;
  }
});

document.addEventListener("keydown", function(e){
  if((e.key === "Enter" || e.key === " ") && e.target.classList.contains("chk")){
    e.preventDefault();
    e.target.click();
  }
});

document.getElementById("showSelOnly").addEventListener("change", function(e){
  document.getElementById("showSelWrap").classList.toggle("on", e.target.checked);
  applyShowSelected();
});

renderAll();
})();
</script>
